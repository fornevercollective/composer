<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>composerIBM — offline Quantum Composer</title>
<link rel="stylesheet" href="styles/composer.css?v=38">
<style>.g-line{display:block}.g-n{color:#5c6778}.g-s{color:#bc8cff}</style>
</head>
<body>
<!-- Completely remade structure: Clean, command-first, surface-oriented, AI-ready design surface -->
<div id="app" data-active-surface="editor">

  <!-- Premium Header with central Command Bar (AITO / high-end tool feel) -->
  <header class="app-header">
    <div class="brand">
      <span class="title">composer</span>
      <span class="tag">trajectory • design • batch</span>
    </div>

    <!-- The heart of grokability: Powerful, always-visible command bar -->
    <div class="command-bar">
      <span class="cmd-prefix">⌘</span>
      <input id="command-input" 
             type="text" 
             placeholder="Type a command... (sweep, world, analyze, load torino, help)" 
             autocomplete="off"
             spellcheck="false">
      <div class="cmd-examples">
        <span class="example" data-cmd="sweep shots">sweep</span>
        <span class="example" data-cmd="open world">world</span>
      </div>
    </div>

    <div class="header-actions">
      <button id="btn-analyze" class="btn primary" title="Run preflight analysis">Analyze</button>
      <button id="btn-export" class="btn" title="Export mission bundle">Export</button>
      <button id="btn-theme-toggle" class="btn icon" title="Toggle theme">◐</button>
      <button id="btn-help" class="btn icon" title="Help & shortcuts">?</button>
    </div>
  </header>

  <!-- Surface / Workspace Switcher - clean, prominent, first-class -->
  <nav class="surface-switcher" role="tablist">
    <button class="surface-btn active" data-surface="editor" title="QASM Editor + Gutter">Editor</button>
    <button class="surface-btn" data-surface="circuit" title="Visual Circuit Designer">Circuit</button>
    <button class="surface-btn" data-surface="charts" title="Live Charts & Analytics">Charts</button>
    <button class="surface-btn" data-surface="world" title="Global Quantum Lattice + Latency">World</button>
    <button class="surface-btn" data-surface="bloch" title="Bloch Sphere & Trajectories">Bloch</button>
    <button class="surface-btn" data-surface="batch" title="Batch Sweeps & Mission Control">Batch</button>
    <div class="switcher-spacer"></div>
    <button class="surface-btn secondary" id="btn-world-lattice" title="Open detailed Global Lattice">+ World</button>
  </nav>

  <!-- Main Workspace: Flexible, modern container for the active surface -->
  <main class="workspace">

  <!-- Clean workspace with dedicated surface containers -->
  <div class="workspace">
    
    <!-- Editor Surface -->
    <div id="surface-editor" class="surface active">
      <div id="editor-wrap">
        <div id="editor-label">
          <span>OpenQASM</span>
          <span class="editor-label-hint">export / sim = code only</span>
          <span id="qg-coverage" class="qg-coverage"></span>
        </div>
        <div id="editor-stack" class="editor-stack">
          <div id="qg-gutter" class="qg-gutter" aria-hidden="true"></div>
          <textarea id="qasm" spellcheck="false" autocomplete="off" aria-label="OpenQASM source"></textarea>
          <div id="qasm-cards" class="qasm-cards"></div>
        </div>
      </div>
      <div id="lane-wrap"><div id="lane"></div></div>
    </div>

    <!-- Other surfaces (JS will show/hide based on .surface-switcher) -->
    <div id="surface-circuit" class="surface">
      <div id="lane"></div> <!-- re-used for circuit -->
    </div>

    <div id="surface-charts" class="surface">
      <div id="charts-host"></div>
    </div>

    <div id="surface-world" class="surface">
      <div id="world-host"></div>
    </div>

    <div id="surface-bloch" class="surface">
      <!-- Bloch content will be managed by existing bloch JS or moved -->
    </div>

    <div id="surface-batch" class="surface">
      <div id="batch-host"></div>
    </div>

  </div>

  <!-- Right context sidebar (collapsible) -->
  <aside id="context-sidebar">
    <div id="stats-panel">
      <h3>Preflight</h3>
      <div id="stats"></div>
    </div>
    <div id="lattice-panel">
      <h3>Lattice</h3>
      <div id="qpu-lattice"></div>
    </div>
    <div id="wave">
      <h3>Waveform</h3>
      <canvas id="wave-canvas" width="260" height="100"></canvas>
    </div>
  </aside>

  <footer id="log-bar"></footer>
</div>

<script src="js/qasm-gutter.js?v=7"></script>
<script src="js/editor-gutter.js?v=4"></script>
<script src="js/qpu-fleet.js?v=5"></script>
<script src="js/qpu-calibrations.js?v=2"></script>
<script src="js/qpu-lattice.js?v=6"></script>
<script src="js/preflight-lite.js"></script>
<script src="js/waveform-qbt.js"></script>
<script src="js/bloch-math.js"></script>
<script src="js/bloch-dual.js"></script>
<script src="js/bloch-trajectory.js"></script>
<script src="js/bloch-render.js?v=4"></script>
<script src="js/bloch-engine.js?v=2"></script>
<script src="js/bloch-panel.js?v=5"></script>
<script src="js/circuit-composer.js?v=12"></script>
<script src="js/concept-steer.js?v=3"></script>
<script src="js/viewer-tabs.js?v=4"></script>
<script src="js/bridge-ugrad.js?v=2"></script>
<script src="js/composer-core.js?v=8"></script>
<!-- Optional ECharts (Phase 1 charting) — CDN for speed + examples; drop echarts.min.js next to wasm/ for airgap -->
<!-- <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script> -->
<script src="js/charts-echarts.js?v=1"></script>
<script src="js/precision-cursor.js?v=1"></script>
<script src="js/global-lattice.js?v=1"></script>
</body>
</html>
