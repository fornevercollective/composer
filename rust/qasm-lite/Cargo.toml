[package]
name = "qasm-lite"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[features]
default = []
wasm = ["wasm-bindgen"]
